name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --run
      - run: npm run build

      # The build can pass with no CSS at all if PostCSS is misconfigured, so
      # assert a stylesheet was actually emitted. This caught a real bug.
      - name: Assert CSS was emitted
        run: |
          count=$(find .next -name '*.css' -not -path '*/cache/*' | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No CSS emitted - check postcss.config.js"
            exit 1
          fi
          echo "CSS files emitted: $count"

  smoke:
    if: github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    env:
      PROD_URL: ${{ secrets.PROD_URL }}
    steps:
      # A missing optional secret should skip the job, not fail the build with
      # a confusing "No host part in the URL" from curl.
      - name: Check PROD_URL is configured
        id: guard
        run: |
          if [ -z "$PROD_URL" ]; then
            echo "::notice::PROD_URL secret is not set - skipping smoke tests."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the Vercel production deploy
        if: steps.guard.outputs.run == 'true'
        run: sleep 60

      - name: Health check
        if: steps.guard.outputs.run == 'true'
        run: |
          curl --fail --retry 5 --retry-delay 10 "${PROD_URL%/}/api/health" | tee health.json
          # A deploy that is up but has no API key is a degraded demo, not a
          # success - surface it as a warning rather than letting it pass quietly.
          grep -q '"ai":"configured"' health.json \
            || echo "::warning::GEMINI_API_KEY is not set on the deployment - running on offline rules only."
          grep -q '"storage":"postgres"' health.json \
            || echo "::warning::DATABASE_URL is not set on the deployment - alerts are in-memory only."

      - name: Check a known scam message end to end
        if: steps.guard.outputs.run == 'true'
        run: |
          curl --fail --retry 3 --retry-delay 5 \
            -X POST "${PROD_URL%/}/api/check" \
            -H 'Content-Type: application/json' \
            -d '{"text":"Your KYC has expired, account blocked in 2 hours. Share the OTP now.","lang":"en"}' \
            | tee check.json
          grep -q -E '"verdict":"(SCAM|SUSPICIOUS)"' check.json
